<!DOCTYPE html>
<html lang="nb">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Min side — Enkel Utleie</title>
    <meta name="description" content="Oversikt over boligene og leieforholdene dine i Enkel Utleie." />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#E8F3FF" />
    <link rel="icon" href="/favicon.png?v=20260920b" type="image/png" />
    <link rel="stylesheet" href="/src/portal-tokens.css" />
    <link rel="stylesheet" href="/src/portal.css" />
    <script src="/auth-state.js"></script>
  </head>
  <body class="pt-body">
    <div class="pt-app" data-portal aria-busy="true">
      <aside class="pt-sidebar" aria-label="Hovedmeny">
        <a class="pt-brand" href="/portal/">
          <img src="/brand/house-mascot.png?v=2" width="44" height="44" alt="" />
          <span class="pt-brand-text">
            <strong>Enkel Utleie</strong>
            <span>Tryggere utleie, enklere hverdag</span>
          </span>
        </a>
        <label class="pt-select-label" for="pt-property">Bolig</label>
        <select class="pt-select" id="pt-property" data-property-select disabled>
          <option>Laster …</option>
        </select>
        <nav class="pt-nav" data-nav></nav>
      </aside>
      <div class="pt-main">
        <header class="pt-topbar">
          <h1 class="pt-topbar-title" data-page-title>Oversikt</h1>
          <div class="pt-topbar-actions">
            <span class="pt-bell" aria-label="Varsler" title="Varsler" data-bell></span>
            <span class="pt-user">
              <span class="pt-avatar" data-avatar>·</span>
              <span class="pt-user-text">
                <strong data-user-name>Laster …</strong>
                <span data-user-role></span>
              </span>
            </span>
            <button type="button" class="pt-btn pt-btn-secondary pt-btn-small" data-sign-out>Logg ut</button>
          </div>
        </header>
        <main class="pt-content" data-content>
          <p class="pt-loading" data-loading>Henter oversikten …</p>
        </main>
      </div>
    </div>
    <script type="module" src="/src/portal.js"></script>
  </body>
</html>
